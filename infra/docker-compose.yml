services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: devsync
      POSTGRES_USER: devsync
      POSTGRES_PASSWORD: devsync
    ports: ["127.0.0.1:5432:5432"]
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "devsync"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  database:
