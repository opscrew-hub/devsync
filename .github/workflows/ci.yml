name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://devsync:devsync@localhost:5432/devsync
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: devsync
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U devsync" --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DEVSYNC_TEST_DB: "1"
      - run: pnpm build
